<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FKOF By -F-</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/png/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/png/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/png/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="msapplication-TileColor" content="#0f172a">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Library inti: defer agar diunduh paralel tanpa memblok parsing HTML.
         Urutan eksekusi tetap terjaga & selesai sebelum DOMContentLoaded. -->
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- xlsx / jspdf / jspdf-autotable / html2canvas dimuat lazy saat fitur
         import/export dipakai (lihat ensureXLSX/ensureJsPDF/ensureHtml2canvas di utils.js). -->

    <link rel="stylesheet" href="style.css?v=1.2.0">
</head>
<body class="min-h-screen text-sm">

    <div id="image-bg-container"></div>

    <div id="body-wrapper">
        <nav id="main-nav" class="glass-panel w-64 flex-shrink-0 flex flex-col p-4 space-y-4 overflow-y-auto">
            <div class="text-center py-4">
                <h1 id="desktop-logo-text" class="glitch-container text-4xl" data-text="FKOF"></h1>
                <p id="desktop-logo-description" class="text-xs text-text-muted mt-2 font-mono tracking-wider"></p>
            </div>

            <div class="flex-grow">
                <h2 class="text-xs font-bold uppercase text-text-muted mb-2 px-2">Laporan</h2>
                <div id="public-menu" class="space-y-1">
                    <button data-view="dashboard" class="btn-nav active">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span>Dashboard</span>
                    </button>
                    <button data-view="summary" class="btn-nav">
                        <i data-lucide="table-2" class="w-5 h-5"></i>
                        <span>Tabel Ringkasan</span>
                    </button>
                    <button data-view="charts" class="btn-nav">
                        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                        <span>Chart Data</span>
                    </button>
                </div>
            </div>

            <div id="protected-menu-wrapper" class="flex-grow">
                <div id="protected-menu-container" class="hidden">
                    <h2 class="text-xs font-bold uppercase text-text-muted my-2 px-2">Manajemen</h2>
                    <div id="protected-menu" class="space-y-1">
                        <button data-view="analysis" class="btn-nav" data-role="Auditor,OED,Master,Admin">
                            <i data-lucide="search-check" class="w-5 h-5"></i>
                            <span>Analisis Data</span>
                        </button>
                        <button data-view="input" class="btn-nav" data-role="OED,Master,Admin">
                            <i data-lucide="plus-square" class="w-5 h-5"></i>
                            <span>Input Data</span>
                        </button>
                        <button data-view="settings" class="btn-nav" data-role="Master">
                            <i data-lucide="settings-2" class="w-5 h-5"></i>
                            <span>Pengaturan</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="public-log-panel" class="mt-auto pt-4 border-t border-border-color">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xs font-bold uppercase text-text-muted px-2">Aktivitas Terkini</h2>
                    <button id="view-all-logs-btn" class="hidden text-text-secondary hover:text-color-primary transition-colors pr-2">
                        <i data-lucide="arrow-right-circle" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="public-log-list" class="space-y-2 text-xs px-2"></div>
            </div>

            <div class="mt-auto pt-4 border-t border-border-color">
                <div id="status-display" class="text-xs text-center text-text-secondary mb-2">Status: Idle</div>
                <div class="flex justify-around items-center">
                    <button id="theme-toggle" class="btn btn-secondary p-2">
                        <i id="theme-toggle-icon" data-lucide="moon" class="w-5 h-5"></i>
                    </button>
                    <button id="footer-login-btn" class="btn btn-secondary p-2">
                        <i data-lucide="log-in" class="w-5 h-5"></i>
                    </button>
                    <button id="footer-user-mgmt-btn" data-view="user-management" class="btn btn-secondary p-2 hidden">
                        <i data-lucide="users" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div id="page-wrapper">
            <div id="app-container" class="relative z-10 flex flex-col gap-4">
                <main class="flex-1 flex flex-col min-h-0">
                    <div id="sticky-filter-wrapper" class="relative sticky top-0 z-20">
                        <div id="filter-panel" class="glass-panel p-4 flex-shrink-0">
                            <div class="grid grid-cols-12 gap-4 items-end">
                                
                                <div class="col-span-4">
                                    <label for="filter-search" class="text-xs font-bold text-text-secondary">Cari</label>
                                    <div class="relative w-full mt-1">
                                        <input type="text" id="filter-search" name="filter-search" class="form-input w-full pr-10" placeholder="Cari nama, keterangan, jumlah...">
                                        <button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary hover:text-color-primary clear-btn hidden">
                                            <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="col-span-2">
                                    <label for="filter-start-date" class="text-xs font-bold text-text-secondary">Tanggal Mulai</label>
                                    <div class="relative w-full mt-1">
                                        <input type="date" id="filter-start-date" name="filter-start-date" class="form-input w-full pr-10">
                                        <button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary hover:text-color-primary clear-btn hidden">
                                            <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="col-span-2">
                                    <label for="filter-end-date" class="text-xs font-bold text-text-secondary">Tanggal Selesai</label>
                                    <div class="relative w-full mt-1">
                                        <input type="date" id="filter-end-date" name="filter-end-date" class="form-input w-full pr-10">
                                        <button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary hover:text-color-primary clear-btn hidden">
                                            <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div id="filter-preset-panel" class="hidden col-span-2">
                                     <div>
                                        <label id="preset-label" for="preset-dropdown-toggle" class="text-xs font-bold text-text-secondary">Preset</label>
                                        <div class="relative mt-1">
                                            <button id="preset-dropdown-toggle" class="form-input w-full flex justify-between items-center text-left">
                                                <span id="preset-dropdown-label">Preset</span>
                                                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform"></i>
                                            </button>
                                            <div id="preset-dropdown-menu" class="absolute hidden mt-2 w-full bg-bg-dropdown border border-border-color rounded-lg shadow-lg z-20 p-2 space-y-2">
                                                <div id="preset-list-container">
                                                </div>
                                                <div class="pt-2 border-t border-border-color">
                                                    <div class="flex items-center gap-2">
                                                        <label for="new-preset-name-input" class="sr-only">Nama Preset Baru</label>
                                                        <input type="text" id="new-preset-name-input" class="form-input form-input-sm flex-grow" placeholder="Nama Preset Baru...">
                                                        <button id="save-new-preset-btn" class="btn btn-primary btn-sm p-1.5 flex-shrink-0" aria-label="Simpan Preset Baru">
                                                            <i data-lucide="save" class="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="col-span-2 flex items-end">
                                    <div class="flex w-full gap-2">
                                        <div class="flex-grow">
                                            <label for="filter-type" class="sr-only">Filter Tipe Data</label>
                                            <select id="filter-type" name="filter-type" class="form-select w-full h-full" title="Filter Tipe Data">
                                                <option value="all" data-short-text="S">Semua</option>
                                                <option value="MANUAL" data-short-text="M">Manual</option>
                                                <option value="TIKET" data-short-text="T">Tiket</option>
                                            </select>
                                        </div>
                                         <button id="business-month-btn" class="btn btn-secondary p-2" title="Tarik Bulan Berjalan">
                                             <i data-lucide="calendar" class="w-5 h-5"></i>
                                         </button>
                                         <button id="reset-btn" class="btn btn-secondary p-2" title="Reset Filter">
                                             <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                                         </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="filter-toggle-handle" class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-full w-auto cursor-pointer" title="Toggle Filter">
                            <div class="glass-panel !rounded-t-none !border-t-0 px-4 py-1 hover:bg-color-primary/20 transition-colors">
                                <i data-lucide="chevron-up" class="w-5 h-5 text-text-secondary transition-transform"></i>
                            </div>
                        </div>
                    </div>
                    <div id="content-view" class="glass-panel flex-1"></div>
                </main>
            </div>
        </div>
    </div>
    
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden">
        <div class="glass-panel p-8 rounded-lg w-full max-w-sm text-center relative">
            <button id="close-login-modal-btn" class="absolute top-4 right-4 text-text-secondary hover:text-color-primary transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h2 class="glitch-container text-2xl mb-4" data-text="Authentication"></h2>
            <p class="text-text-secondary mb-6">Masukkan kredensial untuk mengakses menu.</p>
            <div class="space-y-4">
                <div class="relative w-full">
                    <label for="login-username" class="sr-only">Email</label>
                    <input type="email" id="login-username" name="login-username" class="form-input w-full text-center pr-10" placeholder="email@example.com">
                    <button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary hover:text-color-primary clear-btn hidden">
                        <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                    </button>
                </div>
                <div class="relative w-full">
                    <label for="login-password" class="sr-only">Password</label>
                    <input type="password" id="login-password" name="login-password" class="form-input w-full text-center pr-10" placeholder="********">
                    <button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary hover:text-color-primary clear-btn hidden">
                        <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                    </button>
                </div>
            </div>
            <button id="login-btn" class="btn btn-primary w-full mt-6">Login</button>
            <p id="login-error" class="text-color-danger text-xs mt-4 h-4"></p>
        </div>
    </div>
    <div id="generic-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden">
        <div id="generic-modal-panel" class="glass-panel p-8 rounded-lg w-full max-w-md text-left relative">
            <h2 id="generic-modal-title" class="text-2xl font-display mb-2 text-color-primary"></h2>
            <p id="generic-modal-message" class="text-text-secondary mb-6 whitespace-pre-wrap"></p>
            <div id="generic-modal-content-wrapper" class="max-h-[70vh] overflow-y-auto">
                <div id="generic-modal-content" class="mb-6"></div>
            </div>
            <div id="generic-modal-footer">
                <button id="generic-modal-close-btn" class="btn btn-primary w-full mt-6">Tutup</button>
            </div>
        </div>
    </div>
    <div id="loader" class="fixed inset-0 bg-black bg-opacity-95 z-50 flex flex-col items-center justify-center">
        <svg class="spinner w-16 h-16 text-color-primary" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p id="loader-text" class="mt-4 text-lg font-display text-text-primary" data-text="Inisialisasi Sistem..."></p>
    </div>
    
    <template id="dashboard-template">
        <div class="animate-fade-in flex flex-col h-full">
            <div class="dashboard-header flex justify-end items-center flex-shrink-0 mb-4">
                <button id="configure-widgets-btn" class="btn btn-secondary btn-sm flex items-center gap-2" style="display: none;">
                    <i data-lucide="layout-template" class="w-4 h-4"></i>
                    Atur Widget
                </button>
            </div>
            <div id="dashboard-grid" class="grid gap-4 flex-1 overflow-y-auto">
            </div>
        </div>
    </template>

    <template id="summary-template">
        <div class="animate-fade-in flex flex-col h-full gap-4">
            <div class="flex-shrink-0">
                <h2 class="text-lg font-display font-bold mb-3 flex items-center gap-2 text-text-primary">
                    <i data-lucide="table-2" class="w-5 h-5 text-color-primary"></i>
                    Ringkasan Tipe & Data
                </h2>
                <div class="grid grid-cols-3 gap-4">
                    <div class="glass-panel p-4 border-l-4 border-sky-500">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-text-secondary">TOTAL BIAYA ADMIN (MANUAL)</h3>
                            <div class="p-1.5 rounded-lg bg-sky-500/10 text-sky-400"><i data-lucide="file-text" class="w-4 h-4"></i></div>
                        </div>
                        <p class="text-2xl font-display font-bold text-sky-400 mt-2" id="summary-info-manual-total">Rp 0</p>
                        <p class="text-xs text-text-muted mt-0.5" id="summary-info-manual-count">0 Transaksi</p>
                    </div>
                    <div class="glass-panel p-4 border-l-4 border-purple-500">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-text-secondary">TOTAL BIAYA ADMIN (TIKET)</h3>
                            <div class="p-1.5 rounded-lg bg-purple-500/10 text-purple-400"><i data-lucide="ticket" class="w-4 h-4"></i></div>
                        </div>
                        <p class="text-2xl font-display font-bold text-purple-400 mt-2" id="summary-info-tiket-total">Rp 0</p>
                        <p class="text-xs text-text-muted mt-0.5" id="summary-info-tiket-count">0 Transaksi</p>
                    </div>
                    <div class="glass-panel p-4 border-l-4 border-amber-500">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-text-secondary">DATA TERFILTER</h3>
                            <div class="p-1.5 rounded-lg bg-amber-500/10 text-amber-400"><i data-lucide="filter" class="w-4 h-4"></i></div>
                        </div>
                        <p class="text-2xl font-display font-bold text-amber-400 mt-2" id="summary-info-filtered-count">0</p>
                        <p class="text-xs text-text-muted mt-0.5" id="summary-info-total-count">dari 0 total data</p>
                    </div>
                </div>
            </div>

            <div id="summary-combined-container" class="glass-panel p-2 flex flex-col flex-1 min-h-0">
                <div class="flex justify-between items-center mb-2 flex-shrink-0 px-2">
                    <h2 class="text-xl font-display">Ringkasan Gabungan</h2>
                    <div class="flex gap-2">
                        <div class="relative" id="summary-export-dropdown-container">
                            <button id="summary-export-toggle" class="btn btn-secondary btn-sm flex items-center gap-2">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                <span>Ekspor</span>
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </button>
                            <div id="summary-export-menu" class="absolute hidden right-0 mt-2 w-48 bg-bg-dropdown border border-border-color rounded-lg shadow-lg z-20 p-2 space-y-1">
                                <button id="export-summary-csv" class="w-full btn-nav text-sm !justify-start">Ekspor CSV</button>
                                <button id="export-summary-xlsx" class="w-full btn-nav text-sm !justify-start">Ekspor Excel</button>
                                <button id="export-summary-json" class="w-full btn-nav text-sm !justify-start">Ekspor JSON</button>
                                <button id="export-summary-pdf" class="w-full btn-nav text-sm !justify-start">Ekspor PDF</button>
                                <button id="export-summary-copy" class="w-full btn-nav text-sm !justify-start">Salin ke Clipboard</button>
                            </div>
                        </div>
                        <button id="toggle-column-settings" class="btn btn-primary btn-sm flex items-center gap-2">
                            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Atur Kolom
                        </button>
                    </div>
                </div>
                
                <div id="column-settings-panel" class="p-4 mb-2 hidden flex-shrink-0 bg-black/20 rounded-lg">
                    <h3 class="font-bold text-color-primary mb-2">Tampilkan & Urutkan Kolom Publik</h3>
                    <p class="text-xs text-text-secondary mb-4">Seret untuk mengurutkan. Pengaturan ini hanya untuk tampilan publik.</p>
                    <ul id="column-settings-list" class="space-y-2"></ul>
                    <div class="flex gap-2 mt-4">
                        <button id="save-column-settings" class="btn btn-primary w-full">Terapkan & Simpan</button>
                        <button id="cancel-column-settings" class="btn btn-secondary w-full">Batal</button>
                    </div>
                </div>

                <div id="summary-table-header" class="flex-shrink-0">
                </div>

                <div id="summary-table-body-wrapper" class="overflow-y-auto flex-grow">
                    <div id="summary-scroller" class="relative w-full">
                        <div id="summary-table-body" class="absolute top-0 left-0 w-full">
                        </div>
                    </div>
                </div>

                <div id="summary-table-footer" class="flex-shrink-0 border-t border-border-color">
                </div>
            </div>

        </div>
    </template>

    <template id="charts-template">
        <div class="animate-fade-in flex flex-col h-full">
            <div class="flex justify-between items-start mb-4 flex-shrink-0">
                <div>
                    <h2 id="charts-app-name" class="text-2xl font-display">Grafik & Diagram</h2>
                    <p id="charts-date-range" class="text-sm text-text-secondary mt-1">Memuat rentang tanggal...</p>
                </div>
                <div class="relative" id="charts-export-dropdown-container">
                    <button id="charts-export-toggle" class="btn btn-primary flex items-center gap-2">
                        <i data-lucide="download-cloud" class="w-5 h-5"></i>
                        <span>Unduh Laporan</span>
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <div id="charts-export-menu" class="absolute hidden right-0 mt-2 w-48 bg-bg-dropdown border border-border-color rounded-lg shadow-lg z-20 p-2 space-y-1">
                        <button id="download-charts-png" class="w-full btn-nav text-sm !justify-start">Unduh PNG</button>
                        <button id="download-charts-jpeg" class="w-full btn-nav text-sm !justify-start">Unduh JPEG</button>
                        <button id="download-charts-pdf" class="w-full btn-nav text-sm !justify-start">Unduh PDF</button>
                    </div>
                </div>
            </div>
    
            <div id="charts-container" class="grid grid-cols-2 gap-6 flex-grow overflow-y-auto">
                <div class="glass-panel p-4 flex flex-col">
                    <h2 class="text-xl font-display mb-4">Komisi Outlet (Manual vs Tiket)</h2>
                    <div class="relative flex-grow min-h-[300px]"><canvas id="user-bar-chart"></canvas></div>
                </div>
                <div class="glass-panel p-4 flex flex-col">
                     <h2 class="text-xl font-display mb-4">Distribusi Transaksi</h2>
                     <div class="grid grid-cols-5 gap-4 flex-grow">
                        <div class="col-span-3 relative min-h-[300px]">
                            <canvas id="type-pie-chart"></canvas>
                        </div>
                        <div id="type-stats-panel" class="col-span-2 flex flex-col justify-center space-y-4"></div>
                     </div>
                </div>
            </div>
        </div>
    </template>

    <template id="analysis-template">
        <div class="animate-fade-in flex flex-col h-full">
            <div class="flex justify-between items-start mb-4 flex-shrink-0">
                <div>
                    <h2 id="analysis-title" class="text-2xl font-display">Pencarian & Analisis Data</h2>
                    <p id="analysis-description" class="text-sm text-text-secondary mt-1">Gunakan filter global atau per kolom untuk menyaring data.</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative" id="analysis-export-dropdown-container">
                        <button id="analysis-export-toggle" class="btn btn-secondary flex items-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            <span>Ekspor</span>
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>
                        <div id="analysis-export-menu" class="absolute hidden right-0 mt-2 w-48 bg-bg-dropdown border border-border-color rounded-lg shadow-lg z-20 p-2 space-y-1">
                            <button id="export-analysis-csv" class="w-full btn-nav text-sm !justify-start">Ekspor CSV</button>
                            <button id="export-analysis-xlsx" class="w-full btn-nav text-sm !justify-start">Ekspor Excel</button>
                            <button id="export-analysis-json" class="w-full btn-nav text-sm !justify-start">Ekspor JSON</button>
                        </div>
                    </div>
                    <button id="bulk-action-btn" class="btn btn-secondary flex items-center gap-2" style="display: none;">
                        <i data-lucide="edit" class="w-4 h-4"></i>
                        <span id="bulk-action-btn-text">Ubah Data</span>
                    </button>
                    <button id="delete-selected-btn" class="btn btn-danger flex items-center gap-2" style="display: none;">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span id="delete-btn-text">Hapus Data</span>
                    </button>
                    <button id="audit-mode-toggle-btn" class="btn btn-secondary flex items-center gap-2" style="display: none;">

                    <div id="settings-tab-content-sistem" data-content="sistem" class="settings-tab-content space-y-4 hidden">

                                    <div class="flex gap-4">
                                        <button id="backup-settings-btn" class="btn btn-primary w-full">Backup Pengaturan</button>
                                        <button id="restore-settings-btn" class="btn btn-secondary w-full">Restore Pengaturan</button>

                                </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <button class="accordion-button">
                                <span class="flex items-center gap-3"><i data-lucide="alert-triangle" class="w-5 h-5 text-color-danger"></i> Area Berbahaya</span>

                            </button>
                            <div class="accordion-content">
                                <div class="p-6 border-t border-border-color space-y-4">
                                    <div id="delete-data-panel" class="p-4 border border-color-danger rounded-lg">
                                        <h4 class="font-bold text-color-danger">Hapus Data Transaksi</h4>
                                        <p class="text-xs text-text-secondary">Hapus semua data transaksi dalam rentang tanggal yang dipilih. Tindakan ini permanen.</p>
                                        <div class="grid grid-cols-2 gap-2 mt-2">
                                            <div>
                                                <label for="delete-start-date" class="text-xs font-bold">Tanggal Mulai</label>
                                                <input type="date" id="delete-start-date" name="delete-start-date" class="form-input w-full mt-1">
                                            </div>
                                            <div>
                                                <label for="delete-end-date" class="text-xs font-bold">Tanggal Selesai</label>
                                                <input type="date" id="delete-end-date" name="delete-end-date" class="form-input w-full mt-1">
                                            </div>
                                        </div>
                                        <button id="delete-data-btn" class="btn btn-danger w-full mt-2">Hapus Data Sesuai Rentang</button>
                                    </div>
                                    <div class="p-4 border border-color-warning rounded-lg">
                                        <h4 class="font-bold text-color-warning">Kembalikan Pengaturan Default</h4>
                                        <p class="text-xs text-text-secondary">Jika terjadi kesalahan konfigurasi, Anda dapat mengembalikan semua pengaturan ke kondisi awal (default dari kode).</p>
                                        <button id="reset-settings-btn" class="btn btn-warning w-full mt-2">Kembalikan ke Pengaturan Default</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-auto pt-6 flex justify-end flex-shrink-0">
                    <button id="save-settings-btn" class="btn btn-primary text-lg px-8 py-3">Simpan Semua Pengaturan</button>
                </div>
            </div>
